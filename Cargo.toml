[package]
name = "csv-row-diff"
version = "0.1.0"
edition = "2024"
description = "Log data changes between rows of a CSV file"

[[bin]]
name = "csv-row-diff"
path = "src/main.rs"

[dependencies]
colored = "3.1.1"
csv = "1.4"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
panic = "abort"
